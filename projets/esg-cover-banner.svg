<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Dégradés de fond -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07130e"/>
      <stop offset="50%" stop-color="#0f261c"/>
      <stop offset="100%" stop-color="#091812"/>
    </linearGradient>
    
    <radialGradient id="glowEmerald" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#2f7d5b" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2f7d5b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGold" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#e0a43a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e0a43a" stop-opacity="0"/>
    </radialGradient>

    <!-- Dégradé Ligne Financière -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f7d5b"/>
      <stop offset="45%" stop-color="#52b788"/>
      <stop offset="80%" stop-color="#e0a43a"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#52b788" stop-opacity="0"/>
    </linearGradient>

    <!-- Dégradé Barre E/S/G -->
    <linearGradient id="barE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f4d3a"/><stop offset="100%" stop-color="#52b788"/>
    </linearGradient>
    <linearGradient id="barS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6d2b"/><stop offset="100%" stop-color="#e0a43a"/>
    </linearGradient>
    <linearGradient id="barG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a5a52"/><stop offset="100%" stop-color="#7cc6b0"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
    .subtitle { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 500; fill: #9fb4a8; }
    .badge-text { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #52b788; letter-spacing: 0.14em; text-transform: uppercase; }
    .kpi-num { font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 800; font-size: 26px; fill: #ffffff; }
    .kpi-label { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 12px; fill: #8da498; font-weight: 500; }
    .graph-label { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 12px; fill: #7e968b; font-weight: 600; }
  </style>

  <!-- Fond Principal -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#glowEmerald)"/>
  <rect width="1200" height="675" fill="url(#glowGold)"/>

  <!-- Grille mathématique & financière en filigrane -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="120" x2="1120" y2="120"/>
    <line x1="80" y1="230" x2="1120" y2="230"/>
    <line x1="80" y1="340" x2="1120" y2="340"/>
    <line x1="80" y1="450" x2="1120" y2="450"/>
    <line x1="80" y1="560" x2="1120" y2="560"/>
    <line x1="200" y1="60" x2="200" y2="615"/>
    <line x1="420" y1="60" x2="420" y2="615"/>
    <line x1="640" y1="60" x2="640" y2="615"/>
    <line x1="860" y1="60" x2="860" y2="615"/>
    <line x1="1080" y1="60" x2="1080" y2="615"/>
  </g>

  <!-- Cadre intérieur subtil -->
  <rect x="40" y="40" width="1120" height="595" rx="24" fill="none" stroke="#274237" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- ==================== COLONNE GAUCHE : TEXTES ET METRIQUES ==================== -->
  <g transform="translate(80, 95)">
    <!-- Badge Catégorie -->
    <rect x="0" y="0" width="370" height="34" rx="17" fill="#162e24" stroke="#2f7d5b" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="5" fill="#52b788"/>
    <text x="32" y="22" class="badge-text">ÉTUDE DE CAS · FINANCE QUANTITATIVE</text>

    <!-- Titre Principal -->
    <text x="0" y="90" class="title" font-size="46">Analyse ESG – S&amp;P 500</text>
    
    <!-- Sous-titre -->
    <text x="0" y="130" class="subtitle" font-size="19">Risques Extra-Financiers &amp; Prédiction de la Volatilité Boursière</text>
    <text x="0" y="158" class="subtitle" font-size="14.5" fill="#758c80">Modélisation statistique sous Python (GARCH, XGBoost, TensorFlow) · Sustainalytics</text>

    <!-- Grille de 4 Cartes KPI -->
    <g transform="translate(0, 195)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="220" height="84" rx="14" fill="#0d2119" stroke="#1f4435" stroke-width="1"/>
      <text x="20" y="38" class="kpi-num">503</text>
      <text x="20" y="62" class="kpi-label">Entreprises analysées</text>

      <!-- KPI 2 -->
      <rect x="236" y="0" width="220" height="84" rx="14" fill="#0d2119" stroke="#1f4435" stroke-width="1"/>
      <text x="256" y="38" class="kpi-num" fill="#e0a43a">5 Ans</text>
      <text x="256" y="62" class="kpi-label">Historique boursier (yfinance)</text>

      <!-- KPI 3 -->
      <rect x="0" y="96" width="220" height="84" rx="14" fill="#0d2119" stroke="#1f4435" stroke-width="1"/>
      <text x="20" y="134" class="kpi-num">15</text>
      <text x="20" y="158" class="kpi-label">Variables financières &amp; ESG</text>

      <!-- KPI 4 -->
      <rect x="236" y="96" width="220" height="84" rx="14" fill="#0d2119" stroke="#1f4435" stroke-width="1"/>
      <text x="256" y="134" class="kpi-num" font-size="22">GARCH + GRU</text>
      <text x="256" y="158" class="kpi-label">Modélisation de volatilité</text>
    </g>

    <!-- Signature auteur -->
    <g transform="translate(0, 420)">
      <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#e0a43a" letter-spacing="0.1em">JIHED GHANMI</text>
      <text x="110" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6c8578">· ESCT Tunis · Master Data Science</text>
    </g>
  </g>

  <!-- ==================== COLONNE DROITE : VISUALISATION DATA & FINANCE ==================== -->
  <g transform="translate(620, 95)">
    <!-- Carte Panneau Graphique -->
    <rect x="0" y="0" width="490" height="480" rx="20" fill="#0d2119" stroke="#254d3d" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- En-tête Panneau -->
    <text x="26" y="38" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="15" fill="#edf3ee">Dashboard de Synthèse Décisionnelle</text>
    <rect x="360" y="24" width="104" height="22" rx="11" fill="#1b4333" stroke="#2f7d5b" stroke-width="0.8"/>
    <text x="374" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#7cc6b0">Sustainalytics</text>

    <!-- Graphique 1 : Décomposition des 3 Piliers ESG (Barres) -->
    <g transform="translate(26, 68)">
      <text x="0" y="12" class="graph-label">Score Moyen par Dimension (503 Titres)</text>
      
      <!-- Pilier E -->
      <text x="0" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#d0dfd6" font-weight="600">E · Environnement</text>
      <text x="380" y="42" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#52b788" font-weight="700" text-anchor="end">23.4 / 100</text>
      <rect x="0" y="50" width="438" height="12" rx="6" fill="#18362a"/>
      <rect x="0" y="50" width="280" height="12" rx="6" fill="url(#barE)"/>

      <!-- Pilier S -->
      <text x="0" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#d0dfd6" font-weight="600">S · Social</text>
      <text x="380" y="86" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#e0a43a" font-weight="700" text-anchor="end">18.7 / 100</text>
      <rect x="0" y="94" width="438" height="12" rx="6" fill="#18362a"/>
      <rect x="0" y="94" width="220" height="12" rx="6" fill="url(#barS)"/>

      <!-- Pilier G -->
      <text x="0" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#d0dfd6" font-weight="600">G · Gouvernance</text>
      <text x="380" y="130" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#7cc6b0" font-weight="700" text-anchor="end">14.1 / 100</text>
      <rect x="0" y="138" width="438" height="12" rx="6" fill="#18362a"/>
      <rect x="0" y="138" width="160" height="12" rx="6" fill="url(#barG)"/>
    </g>

    <!-- Séparateur -->
    <line x1="26" y1="240" x2="464" y2="240" stroke="#1f4435" stroke-width="1"/>

    <!-- Graphique 2 : Courbe de Volatilité Boursière Prédictive -->
    <g transform="translate(26, 260)">
      <text x="0" y="14" class="graph-label">Séries Temporelles · Modèle de Volatilité GARCH(1,1)</text>
      <text x="438" y="14" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#e0a43a" font-weight="700" text-anchor="end">5 Ans / Daily</text>

      <!-- Tracé de la surface sous la courbe -->
      <path d="M 0,160 
               C 40,150 70,110 110,125 
               C 150,140 180,80 220,95 
               C 260,110 290,40 330,65 
               C 370,90 400,30 438,20 
               L 438,170 L 0,170 Z" fill="url(#areaGrad)"/>

      <!-- Courbe spline principale -->
      <path d="M 0,160 
               C 40,150 70,110 110,125 
               C 150,140 180,80 220,95 
               C 260,110 290,40 330,65 
               C 370,90 400,30 438,20" 
            fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>

      <!-- Points clés sur la courbe -->
      <circle cx="110" cy="125" r="4" fill="#52b788" stroke="#07130e" stroke-width="2"/>
      <circle cx="220" cy="95" r="4" fill="#52b788" stroke="#07130e" stroke-width="2"/>
      <circle cx="330" cy="65" r="5" fill="#e0a43a" stroke="#07130e" stroke-width="2"/>
      <circle cx="438" cy="20" r="6" fill="#48cae4" stroke="#07130e" stroke-width="2"/>

      <!-- Axes légers -->
      <line x1="0" y1="170" x2="438" y2="170" stroke="#254d3d" stroke-width="1"/>
      <text x="0" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#6c8578">2021</text>
      <text x="140" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#6c8578">2023</text>
      <text x="280" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#6c8578">2025</text>
      <text x="410" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#6c8578">2026</text>
    </g>
  </g>
</svg>